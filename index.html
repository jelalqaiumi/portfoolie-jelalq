<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikonen är JQ-rutan ur loggan, opak och utan luft runt rutan: rutan är
         märket, och en genomskinlig kant hade fyllts med svart av iOS.

         Varje genererad ikonfil refereras här, eftersom dist/ inte får ha
         orefererade filer. Beslutat i ARKITEKTUR.md: M20. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/jq-icon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/jq-icon-96.png" />
    <link rel="apple-touch-icon" href="/assets/jq-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Rollen efter första mittpunkten är samma sträng som "role" i
         src/data/profile.js. Ändras den där ändras den här, i samma
         redigering. -->
    <title>Jelal Qaiumi · Systemutvecklare · Fullstack</title>
    <!-- FÖRSLAG som väntar på Jelals godkännande. Texten bygger på heros
         ingress i src/components/Hero.jsx och ska läsas om när ingressen
         ändras. Beslutat i ARKITEKTUR.md: M21 punkt 3. -->
    <meta name="description" content="Jelal Qaiumi, systemutvecklare. Jag bygger webbappar och mobilappar i React, React Native och .NET, hela vägen från databas till app." />
    <!-- Heros bild hämtas innan JavaScript har renderat sidan, eftersom den är
         det största elementet i första skärmen. imagesrcset och imagesizes ska
         vara exakt samma som srcSet och sizes på bilden i
         src/components/Hero.jsx - annars hämtar webbläsaren bilden två gånger.
         Ändras det ena ändras det andra, i samma redigering. Bygget stannar om
         imagesrcset eller href inte stämmer med HERO_IMAGE_WIDTHS i
         src/data/profile.js. imagesizes kontrolleras inte. -->
    <link rel="preload" as="image" type="image/webp" href="/assets/hero/hero-1440.webp" imagesrcset="/assets/hero/hero-960.webp 960w, /assets/hero/hero-1440.webp 1440w, /assets/hero/hero-1672.webp 1672w" imagesizes="(min-width: 900px) 100vw, 178vw" fetchpriority="high" />
  </head>
  <body>
    <!-- Sidan förrenderas vid bygget och syns därför utan JavaScript, men det
         som är interaktivt kräver JavaScript. Meddelandet säger vad som inte
         fungerar. Texten är ORDAGRANN ur ARKITEKTUR.md - formulera inte om
         den. Ligger direkt före <div id="root"> enligt samma beslut.

         INGEN styling, med avsikt. I bygget länkas CSS:en med <link rel
         stylesheet>, så den laddas även utan JavaScript och meddelandet ärver
         bodys ljusa text mot mörk botten. I dev importeras CSS:en ur main.jsx
         och laddas alltså inte - då blir det webbläsarens standard, svart på
         vitt. Båda är läsbara. En inline-färg hade varit sidans enda
         hårdkodade färg, och en egen klass för meddelandet hade lagt stil i
         global.css för ett element som redan är läsbart i båda lägena. -->
    <noscript>
      <p>
        Menyn, projektfiltret och kontaktformuläret behöver JavaScript. Slå på
        JavaScript i webbläsaren och ladda om sidan.
      </p>
    </noscript>
    <div id="root"></div>
    <!-- id:t ovan är ROOT_ID i src/data/sections.js, som main.jsx renderar i.
         Ändras det ändras det på båda ställena, i samma redigering. Roten ska
         stå tom och på en rad: scripts/prerender.mjs letar efter exakt den
         markeringen i bygget och fyller den med den förrenderade sidan. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
