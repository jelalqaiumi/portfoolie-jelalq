<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Monogram-ikonen med genomskinlig botten, inte lockupen. Flikfältet har
         en egen färg vi inte styr över, så ikonen får inte ha inbakad botten.

         Alla tre genererade ikonfilerna refereras här. Gränsen "noll
         orefererade filer i dist/" gäller utan undantag, och 96-filen ger
         skarp favicon vid hög pixeltäthet i stället för att strykas.
         apple-touch-icon låg tidigare i paket 7; den placeringen är UPPHÄVD,
         eftersom detta är resurslänkar till filer vi redan levererar.
         <noscript> och skip-länken ligger kvar i paket 7 - de är beteende. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-mark-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/logo-mark-96.png" />
    <link rel="apple-touch-icon" href="/assets/logo-mark-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelal Qaiumi — Fullstackutvecklare</title>
  </head>
  <body>
    <!-- Sidan är helt klientrenderad och blir blank utan JavaScript. Det är en
         känd följd av stackvalet, inte ett fel, men ett meddelande kostar
         ingenting. Texten är ORDAGRANN ur ARKITEKTUR.md - formulera inte om
         den. Ligger direkt före <div id="root"> enligt samma beslut.

         INGEN styling, med avsikt. I bygget länkas CSS:en med <link rel
         stylesheet>, så den laddas även utan JavaScript och meddelandet ärver
         bodys ljusa text mot mörk botten. I dev importeras CSS:en ur main.jsx
         och laddas alltså inte - då blir det webbläsarens standard, svart på
         vitt. Båda är läsbara. En inline-färg hade varit sidans enda
         hårdkodade färg, och en .noscript-klass hade blivit en tredje global
         klass som ARKITEKTUR.md stängde dörren för. -->
    <noscript>
      <p>
        Den här sidan behöver JavaScript för att visas. Slå på JavaScript i
        webbläsaren och ladda om sidan.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
